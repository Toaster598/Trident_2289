[include mainsail.cfg]                  # Include configuration from mainsail.cfg file
[include BED_FANS_ACTIVE.cfg]

[virtual_sdcard]
path: /home/trident/printer_data/gcodes    # Path to the virtual SD card directory
on_error_gcode: CANCEL_PRINT            # G-code to execute on error (defined in CANCEL_PRINT macro)

[gcode_arcs]
resolution: 0.1                         # Arc interpolation resolution, handles G2/G3 commands

[exclude_object]                        # Exclude object for cancellation

[force_move]
enable_force_move: true                 # Enable force move feature

#####################################################################
##	                 MCUs
#####################################################################
[mcu]                                   # BTT manta
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_220026000451333231343036-if00
restart_method: command

[mcu cm4]
serial: /tmp/klipper_host_mcu

[mcu cartographer]                      # See https://www.klipper3d.org/Config_Reference.html#mcu
serial: /dev/serial/by-id/usb-Cartographer_614e_2E0044001653584833373720-if00
restart_method: command                # Not needed for probes using CAN. 

[include toolhead_0.cfg]               # in port 6
#[include toolhead_1.cfg]              # temp, will become port 2

#####################################################################
##                     Model and Acceleration
#####################################################################

[printer]                             # Printer configuration
kinematics: corexy                    # Printer type: corexy
max_velocity: 500                     # Maximum velocity - test before changing
max_accel: 55000                      # Maximum acceleration - test before changing
max_z_velocity: 50                    # Maximum Z-axis velocity
max_z_accel: 100                      # Maximum Z-axis acceleration
minimum_cruise_ratio: 0.5             # Default 0.5
square_corner_velocity: 25            # Square corner velocity

#####################################################################
##                            X Axis
#####################################################################

[stepper_x]
step_pin: PD4                         # X-axis motor pulse pin setting
dir_pin: !PD3                         # X-axis motor direction pin setting
enable_pin: !PD6                      # X-axis motor enable pin setting
microsteps: 32                        # Motor microsteps setting
rotation_distance: 40                 # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200          # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: PF3                      # Limit switch PIN setting (X-)
position_min: 0                       # X-axis minimum travel - software limit
position_endstop: 350                 # Mechanical reset point coordinates for X-axis
position_max: 350                     # X-axis maximum travel - software limit
homing_speed: 100                     # Homing speed maximum 100
homing_retract_dist: 5                # Setback distance after the first trigger of the homing switch
second_homing_speed: 20
homing_positive_dir: true             # Direction of homing (generally no change required)

[tmc5160 stepper_x]
cs_pin: PD5                           # Chip select pin
spi_software_sclk_pin: PG8            # SPI clock pin
spi_software_mosi_pin: PG6            # SPI master out slave in pin
spi_software_miso_pin: PG7            # SPI master in slave out pin
driver_TPFD: 0                        # Driver setting
run_current: 1.5                      # Running current
spi_speed: 3500000                    # SPI speed
interpolate: True                     # Interpolation

[stepper_x1]
step_pin: PE6                         # X1-axis motor pulse pin setting
dir_pin: !PE5                         # X1-axis motor direction pin setting
enable_pin: !PC14                     # X1-axis motor enable pin setting
microsteps: 32                        # Motor microsteps setting
rotation_distance: 40                 # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200          # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)

[tmc5160 stepper_x1]
cs_pin: PC13                          # Chip select pin
spi_software_sclk_pin: PG8            # SPI clock pin
spi_software_mosi_pin: PG6            # SPI master out slave in pin
spi_software_miso_pin: PG7            # SPI master in slave out pin
driver_TPFD: 0                        # Driver setting
run_current: 1.5                      # Running current
spi_speed: 3500000                    # SPI speed
interpolate: True                     # Interpolation

#####################################################################
##                           Y Aixs
#####################################################################

[stepper_y]
step_pin: PC7                         # Y-axis motor pulse pin setting
dir_pin: !PC8                         # Y-axis motor direction pin setting
enable_pin: !PD2                      # Y-axis motor enable pin setting
microsteps: 32                        # Motor microsteps setting
rotation_distance: 40                 # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200          # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: PF2                      # Limit switch PIN setting (Y-)
position_min: -15                       # Y-axis minimum travel - software limit
position_endstop: 350               # Mechanical reset point coordinates for Y-axis (change to 350 for 350 models)
position_max: 350                   # Y-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed: 100                     # Homing speed maximum 100
homing_retract_dist: 5                # Setback distance after the first trigger of the homing switch
second_homing_speed: 20
homing_positive_dir: true             # Direction of homing (generally no change required)

[tmc5160 stepper_y]
cs_pin: PC6                           # Chip select pin
spi_software_sclk_pin: PG8            # SPI clock pin
spi_software_mosi_pin: PG6            # SPI master out slave in pin
spi_software_miso_pin: PG7            # SPI master in slave out pin
driver_TPFD: 0                        # Driver setting
run_current: 1.5                      # Running current
spi_speed: 3500000                    # SPI speed
interpolate: True                     # Interpolation

[stepper_y1]
step_pin: PE2                         # Y1-axis motor pulse pin setting
dir_pin: !PE1                         # Y1-axis motor direction pin setting
enable_pin: !PE4                      # Y1-axis motor enable pin setting
microsteps: 32                        # Motor microsteps setting
rotation_distance: 40                 # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200          # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)

[tmc5160 stepper_y1]
cs_pin: PE3                           # Chip select pin
spi_software_sclk_pin: PG8            # SPI clock pin
spi_software_mosi_pin: PG6            # SPI master out slave in pin
spi_software_miso_pin: PG7            # SPI master in slave out pin
driver_TPFD: 0                        # Driver setting
run_current: 1.5                      # Running current
spi_speed: 3500000                    # SPI speed
interpolate: True                     # Interpolation


#####################################################################
#    -------z1------- 
#   |                 |
#   |                 |
#   |                 |
#   |                 |            Z Axis
#   |                 |
#   |                 |
#  z0---   display ---z2
#####################################################################

[stepper_z]
step_pin: PB8                         # Z0-axis motor pulse pin setting
dir_pin: !PB7                         # Z0-axis motor direction pin setting
enable_pin: !PE0                      # Z0-axis motor enable pin setting
microsteps: 16                        # Motor microsteps setting
rotation_distance: 4                  # Active pulley circumference mm
#endstop_pin: probe:z_virtual_endstop # For cartogreapher touch
#endstop_pin: t0:gpio13               # in toolhead config
position_endstop: 0                   # Nozzle is probe
position_max: 235                     # Z0-axis maximum travel - software limit
position_min: -1                      # Z0-axis minimum travel - software limit
homing_speed: 18                      # Homing speed
homing_retract_dist: 4                # Setback distance after the first trigger of the homing switch
second_homing_speed: 3
homing_positive_dir: False            # Direction of homing (generally no change required)

[tmc5160 stepper_z]
cs_pin: PB9                           # Chip select pin
spi_software_sclk_pin: PG8            # SPI clock pin
spi_software_mosi_pin: PG6            # SPI master out slave in pin
spi_software_miso_pin: PG7            # SPI master in slave out pin
driver_TPFD: 0                        # Driver setting
run_current: 0.8                      # Running current
spi_speed: 3500000                    # SPI speed
interpolate: True                     # Interpolation
#--------------------------------------------------------------------
[stepper_z1]
step_pin: PB4                         # Z1-axis motor pulse pin setting
dir_pin: !PB3                         # Z1-axis motor direction pin setting
enable_pin: !PB6                      # Z1-axis motor enable pin setting
microsteps: 16                        # Motor microsteps setting
rotation_distance: 4                  # Active pulley circumference mm

[tmc5160 stepper_z1]
cs_pin: PB5                          # Chip select pin
spi_software_sclk_pin: PG8            # SPI clock pin
spi_software_mosi_pin: PG6            # SPI master out slave in pin
spi_software_miso_pin: PG7            # SPI master in slave out pin
driver_TPFD: 0                        # Driver setting
run_current: 0.8                      # Running current
spi_speed: 3500000                    # SPI speed
interpolate: True                     # Interpolation
#--------------------------------------------------------------------
[stepper_z2]
step_pin: PG13                        # Z2-axis motor pulse pin setting
dir_pin: !PG12                        # Z2-axis motor direction pin setting
enable_pin: !PG15                     # Z2-axis motor enable pin setting
microsteps: 16                        # Motor microsteps setting
rotation_distance: 4                  # Active pulley circumference mm

[tmc5160 stepper_z2]
cs_pin: PG14                          # Chip select pin
spi_software_sclk_pin: PG8            # SPI clock pin
spi_software_mosi_pin: PG6            # SPI master out slave in pin
spi_software_miso_pin: PG7            # SPI master in slave out pin
driver_TPFD: 0                        # Driver setting
run_current: 0.8                      # Running current
spi_speed: 3500000                    # SPI speed
interpolate: True                     # Interpolation

#####################################################################
##                  Heated Bed
#####################################################################
[heater_bed]
heater_pin: PA1                        # (BE0) Heater pin
sensor_pin: PB1                        # Sensor interface (TB) sensor pin
sensor_type: ATC Semitec 104GT-2       # ATC Semitec 104GT-2 temperature sensor type
control: pid                           # Control method   ## Heated bed temperature PID calibration command: "PID_CALIBRATE HEATER=heater_bed TARGET=100"
pid_kp: 56.524                         # PID Kp value
pid_ki: 3.277                          # PID Ki value
pid_kd: 243.75                         # PID Kd value
min_temp: -20                          # Minimum temperature
max_temp: 135                          # Maximum temperature
max_power: 1.0                         # Maximum power

#####################################################################
##                          Idle Timeout for Heated Bed
#####################################################################

[idle_timeout]
timeout: 3600                        # Turn off heated bed if idle for more than 60 minutes

#####################################################################
# 	                 Cartographer V3 
#####################################################################

[cartographer]
mcu: cartographer
x_offset: 0                           # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 24                          # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no                           # For extra output
#calibration_method: touch            # leave this as touch unless you want to use scan only for everything. 
#sensor: cartographer                 # this must be set as cartographer unless using IDM etc.
#sensor_alt: carto                    # alternate name to call commands. CARTO_TOUCH etc
#scanner_touch_z_offset: 0.05         # This is the default and will be overwritten and added to the DO NOT SAVE area by using UI to save z offset
#mesh_runs: 2                         # Number of passes to make during mesh scan.

[bed_mesh]
zero_reference_position: 175,175     # The centre of your bed. 
speed: 300
horizontal_move_z: 3                 # 5 is siboor default
mesh_min: 30, 70                     # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 320, 320                   # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 20, 15
adaptive_margin: 10
algorithm: bicubic
mesh_pps: 0,0                        # Disable interpolation - mesh is probably dense enough

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

#[adxl345]                          # below for when using cartographer as accelerometer
#cs_pin: cartographer:PA3 
#spi_bus: spi1

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#   175, 175, 20 # Fill out the blank with x and y coordinates where you want to run the resonance test.

#####################################################################
##	                 Temperature Monitoring
#####################################################################

[temperature_sensor BTT-MCU]            # BTT-MCU temperature sensor configuration       
sensor_type: temperature_mcu            # Sensor type

[temperature_sensor RPi-CM4]            # RPi CM4 temperature sensor configuration
sensor_type: temperature_host           # Sensor type

#####################################################################
# 	                 Thermistors 
#####################################################################

[thermistor generic_10k_3950]
temperature1: 25
resistance1: 10000
beta: 3950

[temperature_sensor Chamber_top]      # Back top left
sensor_type: generic_10k_3950
sensor_pin: PB0

[temperature_sensor Chamber_mid]      # Front mid left
sensor_type: generic_10k_3950
sensor_pin: PC5

[temperature_sensor Chamber_bottom]   # Mid bottom right
sensor_type: generic_10k_3950
sensor_pin: PC4

[temperature_sensor Chamber_average]
sensor_type: temperature_combined
sensor_list: temperature_sensor Chamber_top, temperature_sensor Chamber_mid, temperature_sensor Chamber_bottom
combination_method: mean
maximum_deviation: 50

#####################################################################
##                  Fans
#####################################################################

[heater_fan Skirt_fan]           # Skirt fan 
pin: PF9                         # FAN-2
cycle_time: 0.00003              # Cycle time
shutdown_speed: 0.0              # Closing speed (Please do not change)
kick_start_time: 0.5             # start-up time (Please do not change)
heater: heater_bed
heater_temp: 45
fan_speed: 1.0

[controller_fan driver_fan]      # Driver cooling fan
pin: PF6                         # Fan pin 
cycle_time: 0.00003              # Cycle time
max_power: 1.0                   # Maximum power
shutdown_speed: 0.0              # Shutdown speed
fan_speed: 1.0                   # Fan speed when heater or stepper driver is active (0.0 to 1.0). Default is 1.0.
idle_timeout: 90                 # Time in seconds to keep the fan running after the stepper driver or heater is no longer active. Default is 30 seconds.
idle_speed: 0.4                  # Fan speed after the stepper driver is no longer active and before idle_timeout is reached (0.0 to 1.0). Default is fan_speed.
stepper: stepper_x               # Active motors

[temperature_fan RPi_fan]
sensor_type: temperature_host    # This is what the CM4's Temperature sensor is known as.
pin: cm4: gpiochip0/gpio26       # Set this to your fan pin
max_temp: 80.0                   # Set below 85C, Pi4+ MCU can be damaged at 85C
min_temp: 0
shutdown_speed: 0.0
kick_start_time: 0.5
max_speed: 1.0
target_temp: 56                  # Set this to your preferred running temperature
max_delta: 4.0                   # on at target + delta, off at target - delta
control: watermark               # watermark or PID

#--------------------------------------------------------------------

#Note: The following FAN0/FAN1/FAN2 settings are only applicable when using OrcaSlicer,
#as only OrcaSlicer allows for the additional configuration of parts cooling fans and filter fans. 

#--------------------------------------------------------------------

[fan_generic fan2]               # 12032 Auxiliary Part cooling Blower 
pin: PA0                         # Fan pin
cycle_time: 0.00003              # Cycle time
hardware_pwm: false              # hardware pwm
kick_start_time: 1.5             # start-up time (Please do not change)

[fan_generic fan3]               # Exhaust fan
pin: PD14                        # Fan pin
max_power: 0.01
cycle_time: 0.00003              # Cycle time
hardware_pwm: false              # hardware pwm
kick_start_time: 0.5             # start-up time (Please do not change)


#--------------------------------------------------------------------

[gcode_macro M106]
gcode:
    {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
    SET_FAN_SPEED FAN={fan} SPEED={speed}

