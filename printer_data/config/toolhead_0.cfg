[mcu t0]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3434343339121F56-if00
restart_method: command

#####################################################################
#   Endstops
#####################################################################
[stepper_z]
endstop_pin: t0:gpio13

#####################################################################
#   Filament Sensor
#####################################################################
[filament_switch_sensor filament_t0]
switch_pin: t0:gpio3
pause_on_runout: True

#####################################################################
# 	Extruder
#####################################################################
[extruder]
step_pin: t0:gpio23
dir_pin: t0:gpio24
enable_pin: !t0:gpio25
heater_pin: t0:gpio9
full_steps_per_rotation: 200         # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
microsteps: 16                       # Microsteps setting
rotation_distance: 4.4723        # Rotation distance - calibrate
nozzle_diameter: 0.500               # Nozzle diameter
filament_diameter: 1.750             # Filament diameter
max_extrude_cross_section: 2.0
max_extrude_only_distance: 150.0
control: pid                         # Control method
pid_Kp: 33.104                       # Proportional parameter of the PID controller
pid_Ki: 9.196                        # Integral parameter of the PID controller
pid_Kd: 29.794                       # Derivative parameter of the PID controller
min_temp: -20                        # Minimum temperature
max_temp: 350                        # Maximum temperature
min_extrude_temp: 170                # Minimum extrude temperature
pressure_advance: 0.04               # Pressure advance - try to keep pressure below 1.0
pressure_advance_smooth_time: 0.040   # Pressure advance smooth time - default is 0.040
sensor_type: PT1000                   # Temperature sensor type
sensor_pin: t0:gpio29
pullup_resistor: 2200

[tmc2209 extruder]
sense_resistor: 0.100
uart_pin: t0:gpio0
tx_pin: t0:gpio1
interpolate: true
run_current: 0.6         #recommend setting it below 0.7A.

#####################################################################
#   Fans
#####################################################################
## PCF
[fan_generic fan0]
pin: t0:gpio6

## HEF
[heater_fan hotend_fan]
pin: t0:gpio5
tachometer_pin: t0:gpio16
tachometer_ppr: 2
heater: extruder                 # Associated heating device
heater_temp: 50.0                # Temperature to start the fan
cycle_time: 0.00003              # Cycle time

#####################################################################
#   Lights
#####################################################################
##t0 Headlights
[neopixel t0_leds]
pin: t0:gpio7
chain_count: 3
color_order: GRB
initial_RED: 0.5
initial_GREEN: 0.42
initial_BLUE: 0.0

## PCB Activity Light
[output_pin act_led]
pin: !t0:gpio8

#####################################################################
#   Accelerometer
#####################################################################
[adxl345]
cs_pin: t0:gpio27
spi_software_sclk_pin: t0:gpio18
spi_software_mosi_pin: t0:gpio20
spi_software_miso_pin: t0:gpio19
axes_map: -x,-y,z

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

probe_points: 175, 175, 20   #for 350mm build

[input_shaper]
shaper_freq_x: 67
shaper_type_x: mzv
shaper_freq_y: 71.6
shaper_type_y: 2hump_ei
  
#####################################################################
#   Addtional Sensors
#####################################################################
[temperature_sensor t0]
sensor_type: temperature_mcu
sensor_mcu: t0
min_temp: 0
max_temp: 100